<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>University Management System</h2>
      <p>Sign in to your account</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="identifier">Email or Mobile</label>
        <input
          type="text"
          id="identifier"
          formControlName="identifier"
          placeholder="Enter email or mobile number"
          class="form-control"
          [class.error]="loginForm.get('identifier')?.invalid && loginForm.get('identifier')?.touched"
        >
        <div class="error-message" *ngIf="loginForm.get('identifier')?.invalid && loginForm.get('identifier')?.touched">
          Email or mobile is required
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Enter your password"
          class="form-control"
          [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        >
        <div class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Password is required
        </div>
      </div>

      <div class="error-message server-error" *ngIf="error">
        {{ error }}
      </div>

      <button
        type="submit"
        class="login-btn"
        [disabled]="loginForm.invalid || loading"
      >
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading">Signing In...</span>
      </button>

      <div class="signup-link">
        <p>Don't have an account? <a routerLink="/signup">Sign up as Faculty</a></p>
      </div>
    </form>
  </div>
</div>
