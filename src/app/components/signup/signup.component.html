<div class="signup-container">
  <div class="signup-card">
    <div class="signup-header">
      <h2>Faculty Registration</h2>
      <p>Create your faculty account</p>
    </div>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="signup-form">
      
      <!-- Personal Information Section -->
      <div class="form-section">
        <div class="form-section-title">Personal Information</div>
        
        <div class="form-group full-width">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            formControlName="name"
            placeholder="Enter your full name"
            class="form-control"
            [class.error]="signupForm.get('name')?.invalid && signupForm.get('name')?.touched"
            [class.success]="signupForm.get('name')?.valid && signupForm.get('name')?.touched"
          >
          <div class="error-message" *ngIf="signupForm.get('name')?.invalid && signupForm.get('name')?.touched">
            Name is required
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              formControlName="email"
              placeholder="Enter your email"
              class="form-control"
              [class.error]="signupForm.get('email')?.invalid && signupForm.get('email')?.touched"
              [class.success]="signupForm.get('email')?.valid && signupForm.get('email')?.touched"
            >
            <div class="error-message" *ngIf="signupForm.get('email')?.invalid && signupForm.get('email')?.touched">
              Valid email is required
            </div>
          </div>

          <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input
              type="tel"
              id="mobile"
              formControlName="mobile"
              placeholder="Enter mobile number"
              class="form-control"
              [class.error]="signupForm.get('mobile')?.invalid && signupForm.get('mobile')?.touched"
              [class.success]="signupForm.get('mobile')?.valid && signupForm.get('mobile')?.touched"
            >
            <div class="error-message" *ngIf="signupForm.get('mobile')?.invalid && signupForm.get('mobile')?.touched">
              Mobile number is required
            </div>
          </div>
        </div>
      </div>

      <!-- Security Section -->
      <div class="form-section">
        <div class="form-section-title">Security</div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              formControlName="password"
              placeholder="Create a password"
              class="form-control"
              [class.error]="signupForm.get('password')?.invalid && signupForm.get('password')?.touched"
              [class.success]="signupForm.get('password')?.valid && signupForm.get('password')?.touched"
            >
            <div class="error-message" *ngIf="signupForm.get('password')?.invalid && signupForm.get('password')?.touched">
              Password must be at least 6 characters
            </div>
            <!-- Password Strength Indicator -->
            <div class="password-strength" *ngIf="signupForm.get('password')?.value && signupForm.get('password')?.touched">
              <div class="strength-bar" [ngClass]="getPasswordStrengthClass()"></div>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              formControlName="confirmPassword"
              placeholder="Confirm your password"
              class="form-control"
              [class.error]="signupForm.hasError('mismatch')"
              [class.success]="signupForm.get('confirmPassword')?.valid && signupForm.get('confirmPassword')?.touched && !signupForm.hasError('mismatch')"
            >
            <div class="error-message" *ngIf="signupForm.hasError('mismatch')">
              Passwords do not match
            </div>
          </div>
        </div>
      </div>

      <!-- Messages -->
      <div class="error-message server-error" *ngIf="error">
        {{ error }}
      </div>

      <div class="success-message" *ngIf="success">
        {{ success }}
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="signup-btn"
        [disabled]="signupForm.invalid || loading"
      >
        <span *ngIf="!loading">Create Faculty Account</span>
        <span *ngIf="loading">Creating Account...</span>
      </button>

      <!-- Login Link -->
      <div class="login-link">
        <p>Already have an account? <a routerLink="/login">Sign in here</a></p>
      </div>
    </form>
  </div>
</div>
