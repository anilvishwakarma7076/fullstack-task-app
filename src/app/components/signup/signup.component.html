<div class="signup-container">
  <div class="signup-card">
    <div class="signup-header">
      <h2>Faculty Registration</h2>
      <p>Create your faculty account</p>
    </div>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="signup-form">
      <div class="form-row">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            formControlName="name"
            placeholder="Enter your full name"
            class="form-control"
            [class.error]="signupForm.get('name')?.invalid && signupForm.get('name')?.touched"
          >
          <div class="error-message" *ngIf="signupForm.get('name')?.invalid && signupForm.get('name')?.touched">
            Name is required
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="Enter your email"
            class="form-control"
            [class.error]="signupForm.get('email')?.invalid && signupForm.get('email')?.touched"
          >
          <div class="error-message" *ngIf="signupForm.get('email')?.invalid && signupForm.get('email')?.touched">
            Valid email is required
          </div>
        </div>

        <div class="form-group">
          <label for="mobile">Mobile Number</label>
          <input
            type="tel"
            id="mobile"
            formControlName="mobile"
            placeholder="Enter your mobile number"
            class="form-control"
            [class.error]="signupForm.get('mobile')?.invalid && signupForm.get('mobile')?.touched"
          >
          <div class="error-message" *ngIf="signupForm.get('mobile')?.invalid && signupForm.get('mobile')?.touched">
            Mobile number is required
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            formControlName="password"
            placeholder="Create a password"
            class="form-control"
            [class.error]="signupForm.get('password')?.invalid && signupForm.get('password')?.touched"
          >
          <div class="error-message" *ngIf="signupForm.get('password')?.invalid && signupForm.get('password')?.touched">
            Password must be at least 6 characters
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            formControlName="confirmPassword"
            placeholder="Confirm your password"
            class="form-control"
            [class.error]="signupForm.hasError('mismatch')"
          >
          <div class="error-message" *ngIf="signupForm.hasError('mismatch')">
            Passwords do not match
          </div>
        </div>
      </div>

      <div class="error-message server-error" *ngIf="error">
        {{ error }}
      </div>

      <div class="success-message" *ngIf="success">
        {{ success }}
      </div>

      <button
        type="submit"
        class="signup-btn"
        [disabled]="signupForm.invalid || loading"
      >
        <span *ngIf="!loading">Create Account</span>
        <span *ngIf="loading">Creating Account...</span>
      </button>

      <div class="login-link">
        <p>Already have an account? <a routerLink="/login">Sign in</a></p>
      </div>
    </form>
  </div>
</div>
